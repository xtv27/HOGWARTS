<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOGWARTS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --bg-dark: #07070b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #11111a 0%, #030305 100%);
            color: #ffffff;
            font-family: 'Playfair Display', serif;
            overflow: hidden; /* Предотвращает появление скролла */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas для магических искр */
        #magic-sparks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            width: 100%;
            max-width: 1000px;
            animation: fadeIn 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            text-transform: uppercase;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #b3b3b3;
            font-size: clamp(1rem, 3vw, 1.5rem);
            letter-spacing: 0.05em;
            margin-bottom: 4rem;
            max-width: 80%;
        }

        .ready-text {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 600;
            letter-spacing: 0.1em;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(243, 229, 171, 0.3);
        }

        .date-box {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 1.2rem 3rem;
            border: 1px solid rgba(212, 175, 55, 0.6);
            background: rgba(212, 175, 55, 0.03);
            backdrop-filter: blur(5px);
            margin-bottom: 3.5rem;
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.05), 0 0 20px rgba(212, 175, 55, 0.1);
            text-transform: uppercase;
        }

        .cta-button {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 700;
            color: var(--bg-dark);
            background-color: var(--gold);
            text-decoration: none;
            padding: 1.2rem 4rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border: 1px solid var(--gold);
            transition: all 0.4s ease;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            cursor: pointer;
        }

        .cta-button:hover {
            background-color: transparent;
            color: var(--gold);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.8), inset 0 0 15px rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        /* Медиа-запрос для мобильных устройств (чтобы скроллинг появлялся только если экран очень маленький по высоте) */
        @media (max-height: 700px) {
            body, html {
                overflow-y: auto;
                align-items: flex-start;
            }
            .content-wrapper {
                padding-top: 4rem;
                padding-bottom: 4rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="magic-sparks"></canvas>

    <div class="content-wrapper">
        <h1 class="title">HOGWARTS</h1>
        <p class="subtitle">Вселенная Гарри Поттера, где ты можешь стать волшебником</p>
        
        <h2 class="ready-text">ТЫ ГОТОВ?</h2>
        
        <div class="date-box">СТАРТ НАБОРА 5 ОКТЯБРЯ!</div>
        
        <a href="https://forms.gle/MbakVRSyn8UwSJwr8" target="_blank" class="cta-button">ПОДАТЬ ЗАЯВКУ</a>
    </div>

    <script>
        const canvas = document.getElementById('magic-sparks');
        const ctx = canvas.getContext('2d');

        let sparksArray = [];
        let w, h;

        function initCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', () => {
            initCanvas();
        });

        class Spark {
            constructor() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 2 + 0.5;
                // Медленное движение вверх
                this.speedY = -(Math.random() * 0.5 + 0.1);
                // Легкое покачивание по горизонтали
                this.speedX = (Math.random() - 0.5) * 0.3;
                // Золотистый цвет с разной прозрачностью
                this.opacity = Math.random() * 0.7 + 0.1;
                // Мерцание
                this.pulseSpeed = Math.random() * 0.02 + 0.005;
                this.pulseDir = 1;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                // Эффект мерцания
                this.opacity += this.pulseSpeed * this.pulseDir;
                if(this.opacity >= 0.8 || this.opacity <= 0.1) {
                    this.pulseDir *= -1;
                }

                // Возврат искры вниз, когда она улетает за верхний край
                if (this.y < 0) {
                    this.y = h;
                    this.x = Math.random() * w;
                }
                
                // Обработка выхода за боковые края
                if (this.x > w) this.x = 0;
                if (this.x < 0) this.x = w;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(212, 175, 55, 0.8)';
                ctx.fill();
            }
        }

        function handleSparks() {
            // Очистка с эффектом легкого шлейфа
            ctx.clearRect(0, 0, w, h);
            
            for (let i = 0; i < sparksArray.length; i++) {
                sparksArray[i].update();
                sparksArray[i].draw();
            }
        }

        function animate() {
            handleSparks();
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            initCanvas();
            // Количество искр зависит от ширины экрана, чтобы не перегружать телефоны
            let numberOfSparks = Math.floor((w * h) / 10000);
            if (numberOfSparks > 150) numberOfSparks = 150; // Ограничение максимума

            for (let i = 0; i < numberOfSparks; i++) {
                sparksArray.push(new Spark());
            }
            animate();
        };
    </script>
</body>
</html>
